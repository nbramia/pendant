name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install (CPU torch first so pip doesn't pull CUDA wheels)
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          uv pip install --python .venv/bin/python -e '.[dev]'
      - name: Test
        run: .venv/bin/python -m pytest -q
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (secrets in the pushed history; the private denylist runs locally before push)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --no-banner -v .
